name: Apex Combate CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-combate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verificações estáticas
        run: python scripts/check_project.py

      - name: Testes unitários e de contrato
        env:
          APEX_DATA_DIR: ${{ runner.temp }}/apex-unit-data
          APEX_JWT_SECRET: apex-ci-unit-secret-with-more-than-32-characters
        run: python -m unittest discover -s tests -v

  smoke:
    name: API e autenticação
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Executar aplicação e smoke test
        env:
          HOST: 0.0.0.0
          PORT: 8080
          APEX_DATA_DIR: ${{ runner.temp }}/apex-smoke-data
          APEX_JWT_SECRET: apex-ci-smoke-secret-with-more-than-32-characters
        run: |
          python server.py > server.log 2>&1 &
          SERVER_PID=$!
          trap 'cat server.log; kill $SERVER_PID 2>/dev/null || true' EXIT
          python scripts/smoke_test.py http://127.0.0.1:8080
          python scripts/v38_flow_test.py http://127.0.0.1:8080

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagem
        run: docker build --tag apex-combate:${{ github.sha }} .
